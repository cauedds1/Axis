  </head>
  <body>
    <div id="splash-screen" style="
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #080808 0%, #0c0808 50%, #080808 100%);
      transition: opacity 0.4s ease-out;
    ">
      <style>
        @keyframes splash-pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.06); opacity: 0.85; }
        }
        @keyframes splash-fade-in {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes splash-dots {
          0%, 20% { opacity: 0.2; }
          50% { opacity: 1; }
          80%, 100% { opacity: 0.2; }
        }
        @media (min-width: 769px) and (display-mode: browser) {
          #splash-screen { display: none !important; }
        }
        @media (min-width: 769px) {
          #splash-screen { display: none !important; }
        }
        @media (display-mode: standalone) {
          #splash-screen { display: flex !important; }
        }
        #splash-screen .splash-logo {
          width: 96px;
          height: 96px;
          border-radius: 24px;
          animation: splash-pulse 2.4s ease-in-out infinite;
          box-shadow: 0 0 40px rgba(255,107,107,0.25), 0 0 80px rgba(255,107,107,0.08);
          object-fit: cover;
        }
        #splash-screen .splash-title {
          margin-top: 20px;
          font-family: 'Inter', 'DM Sans', sans-serif;
          font-size: 28px;
          font-weight: 700;
          letter-spacing: -0.5px;
          background: linear-gradient(135deg, #FF6B6B, #FFB347);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: splash-fade-in 0.6s ease-out 0.2s both;
        }
        #splash-screen .splash-tagline {
          margin-top: 8px;
          font-family: 'Inter', 'DM Sans', sans-serif;
          font-size: 13px;
          font-weight: 400;
          color: rgba(255,255,255,0.3);
          letter-spacing: 0.5px;
          text-transform: uppercase;
          animation: splash-fade-in 0.6s ease-out 0.4s both;
        }
        #splash-screen .splash-loader {
          margin-top: 40px;
          display: flex;
          gap: 6px;
          animation: splash-fade-in 0.6s ease-out 0.6s both;
        }
        #splash-screen .splash-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: #FF6B6B;
        }
        #splash-screen .splash-dot:nth-child(1) { animation: splash-dots 1.2s ease-in-out infinite 0s; }
        #splash-screen .splash-dot:nth-child(2) { animation: splash-dots 1.2s ease-in-out infinite 0.2s; }
        #splash-screen .splash-dot:nth-child(3) { animation: splash-dots 1.2s ease-in-out infinite 0.4s; }
      </style>
      <img src="/logo.png" alt="AXIS" class="splash-logo" />
      <div class="splash-title">AXIS</div>
      <div class="splash-tagline">Your life. Orchestrated.</div>
      <div class="splash-loader">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
